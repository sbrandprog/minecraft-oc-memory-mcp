[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-mcp"
version = "0.1.0"
description = "MCP memory service for an OpenComputers robot agent (Minecraft 1.7.10)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
memory-mcp = "memory_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "memory_mcp/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
